<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение 💕</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Pacifico&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff5f7 0%, #ffe4ec 50%, #fff0f5 100%);
      font-family: 'Comfortaa', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating hearts background */
    .heart-bg {
      position: absolute;
      font-size: 20px;
      color: #ffb6c1;
      opacity: 0.4;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(255, 105, 180, 0.15),
                  0 8px 20px rgba(255, 182, 193, 0.2);
      max-width: 420px;
      width: 90%;
      text-align: center;
      position: relative;
      z-index: 10;
      border: 1px solid #ffe4ec;
      transition: all 0.4s ease;
    }

    .card.hidden {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      position: absolute;
    }

    .emoji {
      font-size: 48px;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 28px;
      color: #e91e63;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .question {
      font-size: 18px;
      color: #555;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 70px;
    }

    .btn {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Comfortaa', sans-serif;
      transition: all 0.25s ease;
      position: relative;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      color: white;
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.35);
    }

    .btn-yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 107, 157, 0.45);
    }

    .btn-no {
      background: #f5f5f5;
      color: #888;
      border: 2px solid #eee;
    }

    .btn-no:hover {
      background: #eee;
    }

    /* Runaway button */
    .btn-no.runaway {
      position: absolute;
      transition: all 0.18s ease;
      z-index: 20;
    }

    /* Time input */
    .time-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .time-input {
      width: 100%;
      max-width: 220px;
      padding: 14px 20px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #ffc0cb;
      border-radius: 50px;
      outline: none;
      font-family: 'Comfortaa', sans-serif;
      color: #e91e63;
      background: #fff0f5;
      transition: border-color 0.2s;
    }

    .time-input:focus {
      border-color: #ff6b9d;
    }

    .time-input::placeholder {
      color: #ffb6c1;
      font-size: 15px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      color: white;
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.35);
      padding: 14px 36px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 107, 157, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .final-message {
      font-size: 18px;
      color: #555;
      line-height: 1.7;
      margin-top: 8px;
    }

    .final-message strong {
      color: #e91e63;
    }

    .hearts-row {
      margin-top: 24px;
      font-size: 28px;
      letter-spacing: 8px;
    }

    .small-text {
      font-size: 13px;
      color: #aaa;
      margin-top: 20px;
    }

    /* Confetti-like hearts on success */
    .success-hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 24px;
    }

    .flying-heart {
      position: absolute;
      font-size: 18px;
      animation: flyUp 1.8s ease-out forwards;
      opacity: 0;
    }

    @keyframes flyUp {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Background floating hearts -->
  <div class="heart-bg" style="top: 10%; left: 8%; animation-delay: 0s;">💕</div>
  <div class="heart-bg" style="top: 20%; right: 12%; animation-delay: 1s; font-size: 16px;">💗</div>
  <div class="heart-bg" style="bottom: 15%; left: 15%; animation-delay: 2s; font-size: 22px;">💖</div>
  <div class="heart-bg" style="bottom: 25%; right: 10%; animation-delay: 0.5s;">💕</div>
  <div class="heart-bg" style="top: 60%; left: 5%; animation-delay: 1.5s; font-size: 14px;">💗</div>
  <div class="heart-bg" style="top: 40%; right: 6%; animation-delay: 2.5s;">💖</div>

  <!-- Step 1: Main invitation -->
  <div class="card" id="step1">
    <div class="emoji">🌸</div>
    <h1>привеи</h1>
    <p class="question">падём завтра со мной гулять?</p>
    <div class="buttons" id="buttons-container">
      <button class="btn btn-yes" onclick="goToStep2()">Да 💕</button>
      <button class="btn btn-no" id="noBtn">Нет</button>
    </div>
    <p class="small-text">просто нажми ❤️</p>
  </div>

  <!-- Step 2: Time input -->
  <div class="card hidden" id="step2">
    <div class="emoji">⏰</div>
    <h1>урооо!</h1>
    <p class="question">во скок пойдём?</p>
    <div class="time-form">
      <input 
        type="text" 
        class="time-input" 
        id="timeInput" 
        placeholder="например 17:00"
        maxlength="20"
        autocomplete="off"
      >
      <button class="btn btn-submit" id="submitBtn" onclick="goToFinal()">Готово 💕</button>
    </div>
  </div>

  <!-- Step 3: Final -->
  <div class="card hidden" id="step3">
    <div class="success-hearts" id="successHearts"></div>
    <div class="emoji">🥰</div>
    <h1>уроооо</h1>
    <p class="final-message" id="finalText">
      уроо, приеду к тебе в <strong id="chosenTime"></strong>,<br>
      одевайся потеплее :3
    </p>
    <div class="hearts-row">💖 💗 💕</div>
    <p class="small-text">жду ни дождусь :3</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const container = document.getElementById('buttons-container');
    const timeInput = document.getElementById('timeInput');
    const submitBtn = document.getElementById('submitBtn');

    // Make the "No" button run away on click (and also on hover for desktop fun)
    noBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      moveNoButton();
    });

    noBtn.addEventListener('mouseenter', moveNoButton);

    function moveNoButton() {
      const containerRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Make it absolute so it can move freely
      noBtn.classList.add('runaway');

      const maxX = Math.max(containerRect.width - btnRect.width - 10, 40);
      const maxY = Math.max(containerRect.height + 50, 80);

      let newX, newY;
      let attempts = 0;
      do {
        newX = Math.random() * maxX;
        newY = Math.random() * maxY - 30;
        attempts++;
      } while (
        attempts < 15 &&
        Math.abs(newX - (btnRect.left - containerRect.left)) < 70 &&
        Math.abs(newY - (btnRect.top - containerRect.top)) < 50
      );

      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    }

    function goToStep2() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      // Focus the input after a short delay
      setTimeout(() => timeInput.focus(), 300);
    }

    function goToFinal() {
      let time = timeInput.value.trim();
      if (!time) {
        time = 'удобное время';
      }

      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
      document.getElementById('chosenTime').textContent = time;

      // Spawn flying hearts
      spawnHearts();
    }

    // Allow Enter key to submit
    timeInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        goToFinal();
      }
    });

    function spawnHearts() {
      const container = document.getElementById('successHearts');
      const hearts = ['💕', '💗', '💖', '❤️', '🌸'];
      
      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'flying-heart';
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.left = Math.random() * 90 + 5 + '%';
          heart.style.bottom = '10px';
          heart.style.animationDelay = (Math.random() * 0.3) + 's';
          container.appendChild(heart);
          
          setTimeout(() => heart.remove(), 2000);
        }, i * 90);
      }
    }
  </script>
</body>
</html>
